<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbfa">
  <meta name="description" content="A model review platform with a GitHub-managed model catalog.">
  <title>Benchline · Review models</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fbfbfa;
      --surface: #fff;
      --ink: #1d1e1c;
      --muted: #6d6e6b;
      --line: #e3e4e0;
      --soft: #f4f5f2;
      --focus: #5b5d58;
    }
    * { box-sizing: border-box; }
    html { font-size: 14px; }
    body { margin: 0; background: var(--background); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; line-height: 1.45; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .3; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(1.75rem, 3vw, 2.2rem); font-weight: 590; letter-spacing: -.045em; line-height: 1.18; }
    h2 { font-size: 1.13rem; font-weight: 620; letter-spacing: -.02em; }
    h3 { font-size: 1rem; font-weight: 620; letter-spacing: -.01em; }
    .page { max-width: 1280px; padding: 0 42px 68px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; gap: 20px; align-items: center; min-height: 74px; border-bottom: 1px solid var(--line); }
    .wordmark { font-size: 1.24rem; font-weight: 690; letter-spacing: -.065em; }
    .topbar-right { display: flex; align-items: center; gap: 18px; }
    .topbar-right { flex-wrap: wrap; justify-content: flex-end; }
    .local-note { font-size: .83rem; color: var(--muted); white-space: nowrap; }
    .heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding: 37px 0 30px; }
    .subtitle { margin-top: 9px; color: var(--muted); font-size: .96rem; }
    .button { background: var(--ink); border: 1px solid var(--ink); color: #fff; padding: 10px 14px; font-weight: 540; border-radius: 5px; min-height: 38px; }
    .button:hover { background: #393a37; }
    .button.secondary { background: var(--surface); color: var(--ink); border: 1px solid #cfd0cb; }
    .button.secondary:hover { background: var(--soft); }
    .button.small { padding: 6px 10px; min-height: 30px; font-size: .86rem; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.13fr) minmax(355px, .87fr); align-items: start; gap: 25px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; }
    .table-panel { overflow: hidden; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
    .panel-subhead { color: var(--muted); font-size: .86rem; }
    .table-tools { display: flex; justify-content: space-between; gap: 12px; padding: 13px 20px; border-bottom: 1px solid var(--line); }
    .search, .select, .field, .long-field, .score-input { background: var(--surface); color: var(--ink); border: 1px solid #d7d9d4; border-radius: 4px; outline: none; }
    .search:focus, .select:focus, .field:focus, .long-field:focus, .score-input:focus { border-color: var(--focus); }
    .search { width: min(100%, 220px); padding: 8px 10px; }
    .select { max-width: 170px; padding: 8px 30px 8px 10px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th { text-align: right; background: #fff; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .055em; font-weight: 590; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    th:first-child { text-align: left; padding-left: 22px; }
    td { padding: 15px 16px; text-align: right; border-bottom: 1px solid #efefec; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    td:first-child { text-align: left; padding-left: 22px; }
    tr.is-selected { background: #f5f5f2; }
    .model-name { display: block; padding: 0; color: var(--ink); font-weight: 600; border: 0; text-align: left; background: transparent; }
    .model-name:hover { text-decoration: underline; text-underline-offset: 3px; }
    .model-provider { color: var(--muted); font-size: .83rem; margin-top: 2px; }
    .score { font-weight: 560; }
    .score.muted { color: #989a96; font-weight: 400; }
    .score-meta { color: #949691; font-size: .74rem; }
    .empty { min-height: 235px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 35px 18px; text-align: center; }
    .empty p { color: var(--muted); max-width: 310px; }
    .empty h3 { font-size: 1.02rem; }

    .rating-panel { position: sticky; top: 20px; }
    .rating-header { padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
    .eyebrow { display: block; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; margin-bottom: 7px; }
    .rating-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .rating-title { font-size: 1.34rem; letter-spacing: -.035em; font-weight: 625; word-break: break-word; }
    .rating-summary { font-variant-numeric: tabular-nums; font-size: 1.2rem; font-weight: 630; }
    .rating-summary small { color: var(--muted); font-size: .75rem; font-weight: 400; }
    .rating-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 8px; color: var(--muted); font-size: .83rem; }
    .link-button { appearance: none; border: 0; padding: 0; background: transparent; color: var(--muted); text-decoration: underline; text-decoration-color: #c9c9c4; text-underline-offset: 3px; }
    .link-button:hover { color: var(--ink); text-decoration-color: var(--ink); }
    .rating-body { padding: 0 22px 22px; }
    .rating-group { padding: 20px 0 18px; border-bottom: 1px solid var(--line); }
    .rating-group:last-of-type { border-bottom: 0; }
    .rating-group-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .rating-group-subtitle { margin-top: 4px; font-size: .82rem; color: var(--muted); }
    .criterion-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 16px; }
    .criterion-name { font-weight: 550; }
    .criterion-description { color: var(--muted); font-size: .81rem; line-height: 1.35; margin-top: 2px; }
    .score-input { width: 70px; height: 36px; flex: none; padding: 6px 7px; text-align: center; font-variant-numeric: tabular-nums; }
    .rating-notes { padding-top: 15px; }
    .review-actions { display:flex; align-items:center; flex-wrap:wrap; gap:13px; margin-top:17px; }
    .review-state { color:var(--muted); font-size:.84rem; }
    .feedback { font-size:.86rem; margin-top:10px; }
    .feedback.error { color:#8a2727; }
    .rating-group-title .score { font-variant-numeric:tabular-nums; }
    .field-label { display: block; color: var(--muted); font-size: .83rem; font-weight: 530; margin-bottom: 7px; }
    .long-field { display: block; width: 100%; padding: 9px 10px; resize: vertical; min-height: 77px; }
    .scale-note { color: var(--muted); font-size: .79rem; margin-top: 12px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
    [hidden] { display: none !important; }





    .footnote { font-size: .82rem; color: var(--muted); margin: 24px 0 0; }
    @media (max-width: 920px) {
      .page { padding: 0 22px 50px; }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .rating-panel { position: static; }
    }
    @media (max-width: 560px) {
      .page { padding: 0 16px 42px; }
      .topbar { min-height: 65px; }
      .topbar-right { gap: 11px; }
      .local-note { display: none; }
      .heading { align-items: start; padding: 29px 0 23px; }
      .heading .button { flex: none; }
      .table-tools { flex-wrap: wrap; }
      .search { flex: 1; }
      .criterion-edit { grid-template-columns: 1fr; }
      .criterion-edit .inline-controls { justify-self: end; }
      .rubric-card { padding: 15px; }
      .rubric-add { flex-wrap: wrap; }
      .rubric-card-head { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="wordmark">benchline.</div>
      <div class="topbar-right">
        <span class="local-note">Model catalog managed on GitHub</span>
      </div>
    </header>
    <main>
      <section id="leaderboard-view">
        <div class="heading">
          <div>
            <h1>Model ratings</h1>
            <p class="subtitle">Select a model and submit your review.</p>
          </div>

        </div>
        <div class="workspace">
          <section class="panel table-panel" aria-label="Model leaderboard">
            <div class="panel-header">
              <h2>Models</h2>
              <span class="panel-subhead" id="model-count">0 models</span>
            </div>
            <div class="table-tools">
              <input class="search" id="search" aria-label="Search models" placeholder="Search models" autocomplete="off">
              <select class="select" id="sort" aria-label="Sort models"></select>
            </div>
            <div id="leaderboard-table"></div>
          </section>
          <section class="panel rating-panel" id="rating-editor" aria-label="Model rating editor"></section>
        </div>
        <p class="footnote">Scores range from 0 to 10. Blank criteria do not affect averages. Reviews are currently saved only in your browser. Public review collection requires a backend.</p>
      </section>
    </main>
  </div>

  <script id="fixed-rubric" type="application/json">

  <script>
"use strict";
const STORAGE_KEY = "benchline.reviews.v1";
const LEGACY_KEY = "benchline.workspace.v2";
const categories = JSON.parse(document.getElementById("fixed-rubric").textContent || "[]");
const MODEL_CATALOG_URL = "./models.json";
let catalog = [];
let modelIds = new Set();
let catalogLoaded = false;
let catalogError = "";
const criterionIds = new Set(categories.flatMap(category => category.criteria.map(criterion => criterion.id)));
const element = (id) => document.getElementById(id);
const escapeHtml = (value) => value.replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[char] || char));
const safeRating = (value) => ({
    scores: Object.fromEntries(Object.entries(value?.scores || {}).filter(([key, score]) => criterionIds.has(key) && typeof score === "number" && Number.isFinite(score) && score >= 0 && score <= 10)),
    notes: typeof value?.notes === "string" ? value.notes.slice(0, 20000) : ""
});
const normalizeWorkspace = (value) => {
    const reviews = {};
    const drafts = {};
    for (const id of modelIds) {
        if (value?.reviews?.[id]) {
            const rating = safeRating(value.reviews[id]);
            reviews[id] = { ...rating, submittedAt: typeof value.reviews[id].submittedAt === "number" ? value.reviews[id].submittedAt : Date.now() };
        }
        if (value?.drafts?.[id])
            drafts[id] = safeRating(value.drafts[id]);
    }
    return { version: 2, reviews, drafts };
};
const loadWorkspace = () => {
    try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored)
            return normalizeWorkspace(JSON.parse(stored));
        const old = localStorage.getItem(LEGACY_KEY);
        if (old) {
            const saved = JSON.parse(old);
            const drafts = {};
            if (Array.isArray(saved.models))
                for (const model of saved.models) {
                    if (!modelIds.has(model.id))
                        continue;
                    const rating = safeRating(model);
                    if (Object.keys(rating.scores).length || rating.notes)
                        drafts[model.id] = rating;
                }
            return { version: 2, reviews: {}, drafts };
        }
    }
    catch { }
    return { version: 2, reviews: {}, drafts: {} };
};
let workspace = { version: 2, reviews: {}, drafts: {} };
let selectedModelId = null;
let sortBy = "overall";
let searchQuery = "";
let feedback = "";
const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(workspace));
const selectedModel = () => catalog.find(model => model.id === selectedModelId);
const average = (values) => values.length ? values.reduce((sum, score) => sum + score, 0) / values.length : null;
const categoryScores = (rating, category) => category.criteria
    .map(criterion => rating.scores[criterion.id])
    .filter((score) => typeof score === "number" && Number.isFinite(score) && score >= 0 && score <= 10);
const categoryScore = (rating, category) => average(categoryScores(rating, category));
const overallScore = (rating) => average(categories
    .map(category => categoryScore(rating, category))
    .filter((score) => score !== null));
const scoreLabel = (value) => value === null ? "—" : value.toFixed(1);
const currentDraft = (id) => workspace.drafts[id] || workspace.reviews[id] || { scores: {}, notes: "" };
const updateDraft = (id, updater) => {
    const previous = currentDraft(id);
    const draft = { scores: { ...previous.scores }, notes: previous.notes };
    updater(draft);
    workspace.drafts[id] = draft;
    save();
};
function render() {
    renderSort();
    renderLeaderboard();
    renderRatingEditor();
}
function renderSort() {
    const options = [{ value: "overall", label: "Overall" }, ...categories.map(category => ({ value: category.id, label: category.name })), { value: "name", label: "Name" }];
    if (!options.some(option => option.value === sortBy))
        sortBy = "overall";
    element("sort").innerHTML = options
        .map(option => `<option value="${escapeHtml(option.value)}" ${option.value === sortBy ? "selected" : ""}>Sort: ${escapeHtml(option.label)}</option>`).join("");
}
function renderLeaderboard() {
    if (!catalogLoaded || catalogError) {
        element("model-count").textContent = catalogLoaded ? "Unavailable" : "Loading";
        element("leaderboard-table").innerHTML = `<div class="empty"><h3>${catalogError ? "Catalog unavailable" : "Loading models"}</h3><p>${catalogError ? escapeHtml(catalogError) : "Reading models.json"}</p></div>`;
        return;
    }
    const count = Object.keys(workspace.reviews).length;
    element("model-count").textContent = `${catalog.length} ${catalog.length === 1 ? "model" : "models"} · ${count} ${count === 1 ? "personal review" : "personal reviews"}`;
    const results = catalog.filter(model => `${model.name} ${model.provider}`.toLowerCase().includes(searchQuery.toLowerCase()));
    if (sortBy === "name")
        results.sort((a, b) => a.name.localeCompare(b.name));
    else {
        const score = (model) => {
            const review = workspace.reviews[model.id];
            if (!review)
                return null;
            return sortBy === "overall" ? overallScore(review) : categoryScore(review, categories.find(category => category.id === sortBy) || categories[0]);
        };
        results.sort((a, b) => {
            const aScore = score(a);
            const bScore = score(b);
            if (aScore === null && bScore !== null)
                return 1;
            if (aScore !== null && bScore === null)
                return -1;
            return (bScore ?? 0) - (aScore ?? 0) || a.name.localeCompare(b.name);
        });
    }
    if (!results.length) {
        element("leaderboard-table").innerHTML = catalog.length
            ? `<div class="empty"><h3>No matching models</h3><p>Try a different search.</p></div>`
            : `<div class="empty"><h3>No models available</h3><p>The model catalog is maintained by the site owner.</p></div>`;
        return;
    }
    element("leaderboard-table").innerHTML = `<div class="table-scroll"><table>
    <thead><tr><th>Model</th>${categories.map(category => `<th>${escapeHtml(category.name)}</th>`).join("")}<th>My rating</th></tr></thead>
    <tbody>${results.map(model => {
        const review = workspace.reviews[model.id];
        return `<tr class="${selectedModelId === model.id ? "is-selected" : ""}">
        <td><button type="button" class="model-name" data-action="select-model" data-id="${escapeHtml(model.id)}">${escapeHtml(model.name)}</button>${model.provider ? `<div class="model-provider">${escapeHtml(model.provider)}</div>` : ""}</td>
        ${categories.map(category => {
            const score = review ? categoryScore(review, category) : null;
            return `<td><div class="score ${score === null ? "muted" : ""}">${scoreLabel(score)}</div>${score !== null && review ? `<div class="score-meta">${categoryScores(review, category).length}/${category.criteria.length}</div>` : ""}</td>`;
        }).join("")}
        <td><span class="score ${review && overallScore(review) !== null ? "" : "muted"}">${review ? scoreLabel(overallScore(review)) : "—"}</span></td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}
function renderRatingEditor() {
    if (!catalogLoaded || catalogError) {
        element("rating-editor").innerHTML = `<div class="panel-header"><h2>Your review</h2></div><div class="empty"><p>${catalogError ? "The model catalog could not be loaded." : "Loading models"}</p></div>`;
        return;
    }
    const model = selectedModel();
    if (!model) {
        element("rating-editor").innerHTML = `<div class="panel-header"><h2>Your review</h2></div><div class="empty"><h3>Nothing selected</h3><p>Select an available model to review it.</p></div>`;
        return;
    }
    const draft = currentDraft(model.id);
    const submitted = workspace.reviews[model.id];
    const overall = overallScore(draft);
    element("rating-editor").innerHTML = `
    <div class="rating-header">
      <span class="eyebrow">Your review</span>
      <div class="rating-top"><div class="rating-title">${escapeHtml(model.name)}</div><div class="rating-summary">${scoreLabel(overall)}<small> / 10</small></div></div>
      <div class="rating-meta"><span>${escapeHtml(model.provider)}</span><span>${submitted ? "Review saved locally" : "Not submitted"}</span></div>
    </div>
    <div class="rating-body">
      ${categories.map(category => {
        const mean = categoryScore(draft, category);
        return `<section class="rating-group">
          <div class="rating-group-title"><h3>${escapeHtml(category.name)}</h3><span class="score ${mean === null ? "muted" : ""}">${scoreLabel(mean)}</span></div>
          ${category.description ? `<p class="rating-group-subtitle">${escapeHtml(category.description)}</p>` : ""}
          ${category.criteria.map(criterion => {
            const score = draft.scores[criterion.id];
            return `<label class="criterion-row"><span><span class="criterion-name">${escapeHtml(criterion.name)}</span>${criterion.description ? `<span class="criterion-description" style="display:block">${escapeHtml(criterion.description)}</span>` : ""}</span><input class="score-input" type="number" inputmode="decimal" min="0" max="10" step="0.1" placeholder="—" aria-label="${escapeHtml(category.name)}: ${escapeHtml(criterion.name)} score" data-score-id="${escapeHtml(criterion.id)}" value="${typeof score === "number" ? score : ""}"></label>`;
        }).join("")}
        </section>`;
    }).join("")}
      <div class="rating-notes"><label class="field-label" for="model-notes">Review notes (optional)</label><textarea id="model-notes" class="long-field" placeholder="Observations, tests, or examples">${escapeHtml(draft.notes)}</textarea>
        <div class="review-actions"><button type="button" class="button" data-action="submit-review">${submitted ? "Update my review" : "Submit review"}</button><span class="review-state">${submitted ? "Your existing review will be replaced." : "At least one score is required."}</span></div>
        ${feedback ? `<p class="feedback ${feedback.startsWith("Enter") ? "error" : ""}" role="status">${escapeHtml(feedback)}</p>` : ""}
        <div class="scale-note">Scores are 0–10. Empty criteria are excluded. Reviews are stored locally in this prototype.</div>
      </div>
    </div>`;
}
function submitReview() {
    if (!selectedModelId || !modelIds.has(selectedModelId))
        return;
    const draft = safeRating(currentDraft(selectedModelId));
    if (!Object.keys(draft.scores).length) {
        feedback = "Enter at least one score before submitting.";
        renderRatingEditor();
        return;
    }
    workspace.reviews[selectedModelId] = { ...draft, submittedAt: Date.now() };
    delete workspace.drafts[selectedModelId];
    save();
    feedback = "Review saved in this browser. Public submission requires a backend.";
    render();
}
document.addEventListener("click", event => {
    const button = event.target.closest("[data-action]");
    if (!button)
        return;
    if (button.dataset.action === "select-model") {
        selectedModelId = button.dataset.id || null;
        feedback = "";
        renderLeaderboard();
        renderRatingEditor();
    }
    if (button.dataset.action === "submit-review")
        submitReview();
});
document.addEventListener("change", event => {
    const target = event.target;
    if (!target.matches("[data-score-id]") || !selectedModelId)
        return;
    const id = target.dataset.scoreId || "";
    if (!criterionIds.has(id))
        return;
    updateDraft(selectedModelId, draft => {
        if (!target.value.trim())
            delete draft.scores[id];
        else {
            const score = Number(target.value);
            if (Number.isFinite(score))
                draft.scores[id] = Math.max(0, Math.min(10, Math.round(score * 10) / 10));
        }
    });
    feedback = "";
    renderRatingEditor();
});
document.addEventListener("input", event => {
    const target = event.target;
    if (target.id !== "model-notes" || !selectedModelId)
        return;
    updateDraft(selectedModelId, draft => { draft.notes = target.value; });
});
element("search").addEventListener("input", event => {
    searchQuery = event.target.value;
    renderLeaderboard();
});
element("sort").addEventListener("change", event => {
    sortBy = event.target.value;
    renderLeaderboard();
});
async function loadCatalog() {
    try {
        const response = await fetch(MODEL_CATALOG_URL, { cache: "no-store" });
        if (!response.ok)
            throw new Error("Request failed");
        const data = await response.json();
        if (!Array.isArray(data) || data.some(item => !item || typeof item.id !== "string" || typeof item.name !== "string" ||
            typeof item.provider !== "string" || !item.id.trim() || !item.name.trim())) {
            throw new Error("Invalid model catalog");
        }
        const ids = data.map(item => item.id);
        if (new Set(ids).size !== ids.length)
            throw new Error("Duplicate model IDs");
        catalog = data.map(({ id, name, provider }) => ({ id, name, provider }));
        modelIds = new Set(ids);
        workspace = loadWorkspace();
        selectedModelId = catalog[0]?.id ?? null;
    }
    catch {
        catalogError = "Check that models.json is next to Benchline.html and that the site is served over HTTP or HTTPS.";
    }
    catalogLoaded = true;
    render();
}
render();
void loadCatalog();

  </script>
